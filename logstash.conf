input {
  udp {
    host => "0.0.0.0"
    port => ${LS_PORT}
  }
}

filter {
  # add any parsing/filtering here
}

output {
  elasticsearch {
    index => "logstash-%{+YYYY.MM.dd}"
    hosts => ["https://es01:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl => true
    cacert => "/usr/share/logstash/certs/ca/ca.crt"
  }
  #stdout { codec => rubydebug }
}
